[mod]
id = "waypoints"
version = "0.1.0"

[compatibility]
horizon_revision = "a2258be0b2990d0c645a61c8a5e8c79a61b9c1c5"

# No pin: Starling's mod build sets the commit it builds on. The mod only uses
# hook points (hud, command, commands) and the game's native_* helpers.

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "waypoints"
source = "runtime.rs"

# The HUD: the saved places near the player, as a box in the top left corner.
[[injection]]
id = "hud"
kind = "HEAD"
hook = "hud"
hook_version = 1
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

# `/wp add NAME`, `/wp remove NAME`, `/wp list`, typed in chat.
[[injection]]
id = "command"
kind = "HEAD"
hook = "command"
hook_version = 1
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# So the chat box lists and completes `/wp`.
[[injection]]
id = "commands"
kind = "HEAD"
hook = "commands"
hook_version = 1
helper = "commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]

# A key (or a touch button bound to it).
[[injection]]
id = "key"
kind = "HEAD"
hook = "key"
hook_version = 1
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# An outline round each saved place, in the world.
[[injection]]
id = "visuals"
kind = "HEAD"
hook = "visuals"
hook_version = 1
helper = "visuals.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "rims", ty = "&mut Vec<horizon_client::mod_api::NativeBlockRim>", value = "&mut *rims" },
]

# The menu: a row in Options > Mods with a page of buttons.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
